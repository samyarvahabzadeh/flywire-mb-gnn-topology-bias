[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbtopology"
version = "0.1.0"
requires-python = ">=3.11"
description = "Sparse, audited week-one FlyWire ingestion; no model training"
dependencies = [
  "polars>=1.0", "pyarrow>=17", "scipy>=1.13", "numpy>=1.26",
  "torch>=2.5", "torch-geometric>=2.6", "PyYAML>=6",
  "requests>=2.32", "networkx>=3", "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.tmp/pytest"

[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
